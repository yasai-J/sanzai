<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>散剤換算</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="散剤換算">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d42a2a">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
<style>
/* Layout: one-screen app, inputs on a "付箋" card, big red result, bottom tab bar */
:root {
  --bg: #eef2ee;
  --card: #f7f9f1;
  --line: #cfd8cc;
  --fg: #1f2a24;
  --muted: #5f6d64;
  --red: #d42a2a;
  --red-soft: #fbe3e1;
  --blue: #2f45a8;
  --tab: #ffffff;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-num: "Barlow Semi Condensed", "SF Pro Rounded", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a17; --card: #1d2520; --line: #34413a; --fg: #e8eee9; --muted: #9aa8a0;
    --red: #ff6b63; --red-soft: #3a2220; --blue: #8fa2ff; --tab: #1a211d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a17; --card: #1d2520; --line: #34413a; --fg: #e8eee9; --muted: #9aa8a0;
  --red: #ff6b63; --red-soft: #3a2220; --blue: #8fa2ff; --tab: #1a211d; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px;
  display: flex; flex-direction: column;
}
main {
  flex: 1; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 24px;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { margin: 0; font-size: 26px; font-weight: 700; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
label.lbl { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.star { color: var(--red); font-size: 15px; }
.field { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.field:focus-within { border-color: var(--blue); }
.field input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg);
  font-family: var(--font-num); font-size: 40px; font-weight: 700; padding: 0;
  font-variant-numeric: tabular-nums; outline: none;
}
.field input::placeholder { color: var(--line); }
.unit { font-family: var(--font-num); font-size: 24px; font-weight: 500; color: var(--muted); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button {
  font-family: var(--font-num); font-size: 17px; font-weight: 700;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.presets button.on { border-color: var(--red); background: var(--red-soft); color: var(--red); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.result {
  border: 2px solid var(--red); border-radius: 14px; padding: 16px;
  background: var(--card); display: flex; flex-direction: column; gap: 4px;
}
.result .lbl { color: var(--red); }
.big { display: flex; align-items: baseline; justify-content: center; gap: 8px; color: var(--red); }
.big .num { font-family: var(--font-num); font-size: 72px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.big .u { font-family: var(--font-num); font-size: 30px; font-weight: 700; }
.formula { text-align: center; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.note { color: var(--muted); font-size: 13px; text-align: center; }
.clear {
  align-self: center; border: 0; background: transparent; color: var(--blue);
  font-family: var(--font-body); font-size: 15px; font-weight: 500; padding: 8px 16px; cursor: pointer;
}

nav.tabs {
  display: flex; background: var(--tab); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs button {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  font-family: var(--font-body); font-size: 12px; font-weight: 700;
  padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
}
nav.tabs button .ic { font-family: var(--font-num); font-size: 18px; font-weight: 700; }
nav.tabs button[aria-selected="true"] { color: var(--red); }
</style>
</head>
<body>

<main>
  <div class="wrap">
    <header>
      <h1 id="title">散 → 錠</h1>
      <p id="sub">散剤の量から成分量（錠剤換算）を出します</p>
    </header>

    <section class="card">
      <label class="lbl" for="pct"><span class="star">★</span>散剤の規格</label>
      <div class="field">
        <input id="pct" inputmode="decimal" autocomplete="off" placeholder="10" value="10">
        <span class="unit">%</span>
      </div>
      <div class="presets" id="presets">
        <button type="button" data-v="1">1%</button>
        <button type="button" data-v="2">2%</button>
        <button type="button" data-v="10">10%</button>
        <button type="button" data-v="20">20%</button>
        <button type="button" data-v="50">50%</button>
      </div>
    </section>

    <section class="card">
      <label class="lbl" for="amt"><span class="star">★</span><span id="amtLabel">散剤の量（製剤量）</span></label>
      <div class="field">
        <input id="amt" inputmode="decimal" autocomplete="off" placeholder="0.5" value="0.5">
        <span class="unit" id="amtUnit">g</span>
      </div>
    </section>

    <section class="result" aria-live="polite">
      <span class="lbl" id="resLabel">錠剤換算（成分量）</span>
      <div class="big"><span class="num" id="resNum">50</span><span class="u" id="resUnit">mg</span></div>
      <div class="formula" id="formula"></div>
    </section>

    <button type="button" class="clear" id="clear">入力をクリア</button>
    <p class="note">計算結果は必ずご自身でも確認してください</p>
  </div>
</main>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" id="tab1" aria-selected="true"><span class="ic">g → mg</span>散 → 錠</button>
  <button type="button" role="tab" id="tab2" aria-selected="false"><span class="ic">mg → g</span>錠 → 散</button>
</nav>

<script>
(function () {
  var mode = 1; // 1: 散→錠, 2: 錠→散
  var store = { 1: { amt: "0.5" }, 2: { amt: "50" } };
  var $ = function (id) { return document.getElementById(id); };
  var pct = $("pct"), amt = $("amt");

  function norm(s) {
    return String(s)
      .replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[,，、]/g, ".").trim();
  }
  function num(s) {
    var t = norm(s);
    if (!/^\d*\.?\d+$|^\d+\.$/.test(t)) return NaN;
    return parseFloat(t);
  }
  function fmt(x) {
    var r = Math.round(x * 1000) / 1000;
    return r.toLocaleString("ja-JP", { maximumFractionDigits: 3 });
  }

  function calc() {
    var p = num(pct.value), a = num(amt.value);
    document.querySelectorAll("#presets button").forEach(function (b) {
      b.classList.toggle("on", norm(pct.value) === b.dataset.v);
    });
    var ok = p > 0 && p <= 100 && a >= 0;
    if (!ok) { $("resNum").textContent = "—"; $("formula").textContent = p > 100 ? "規格は100%以下で入力してください" : ""; return; }
    if (mode === 1) {
      var mg = a * p * 10;
      $("resNum").textContent = fmt(mg);
      $("formula").textContent = fmt(a) + " g × " + fmt(p) + "% × 10 = " + fmt(mg) + " mg";
    } else {
      var g = a / (p * 10);
      $("resNum").textContent = fmt(g);
      $("formula").textContent = fmt(a) + " mg ÷ (" + fmt(p) + "% × 10) = " + fmt(g) + " g";
    }
  }

  function setMode(m) {
    store[mode].amt = amt.value;
    mode = m;
    amt.value = store[m].amt;
    $("tab1").setAttribute("aria-selected", m === 1);
    $("tab2").setAttribute("aria-selected", m === 2);
    if (m === 1) {
      $("title").textContent = "散 → 錠";
      $("sub").textContent = "散剤の量から成分量（錠剤換算）を出します";
      $("amtLabel").textContent = "散剤の量（製剤量）";
      $("amtUnit").textContent = "g"; amt.placeholder = "0.5";
      $("resLabel").textContent = "錠剤換算（成分量）";
      $("resUnit").textContent = "mg";
    } else {
      $("title").textContent = "錠 → 散";
      $("sub").textContent = "必要な成分量から散剤を何g量るかを出します";
      $("amtLabel").textContent = "必要な成分量（錠剤の量）";
      $("amtUnit").textContent = "mg"; amt.placeholder = "50";
      $("resLabel").textContent = "散剤の量（製剤量）";
      $("resUnit").textContent = "g";
    }
    try { localStorage.setItem("sanzai-mode", String(m)); } catch (e) {}
    calc();
  }

  pct.addEventListener("input", calc);
  amt.addEventListener("input", calc);
  $("presets").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    pct.value = b.dataset.v; calc();
  });
  $("tab1").addEventListener("click", function () { setMode(1); });
  $("tab2").addEventListener("click", function () { setMode(2); });
  $("clear").addEventListener("click", function () {
    pct.value = ""; amt.value = ""; store = { 1: { amt: "" }, 2: { amt: "" } }; calc(); pct.focus();
  });

  var saved = 1;
  try { saved = parseInt(localStorage.getItem("sanzai-mode"), 10) || 1; } catch (e) {}
  setMode(saved === 2 ? 2 : 1);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
